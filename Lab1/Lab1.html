<!DOCTYPE html>
<html>
<head>
    <title>Simple Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        .calculator {
            width: 300px;
            margin: 100px auto;
            padding: 20px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        .display {
            width: 100%;
            height: 50px;
            margin-bottom: 15px;
            background-color: #eee;
            border: none;
            border-radius: 5px;
            text-align: right;
            font-size: 24px;
            padding: 0 10px;
            box-sizing: border-box;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            height: 50px;
            border: none;
            border-radius: 5px;
            background-color: #ddd;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background-color: #ccc;
        }

        .operator {
            background-color: #4CAF50;
            color: white;
        }

        .equal {
            background-color: #2196F3;
            color: white;
        }

        .clear {
            background-color: #f44336;
            color: white;
        }
    </style>
</head>

<body>

    <div class="calculator">

        <h2>Calculator</h2>

        <input type="text" class="display" value="0" readonly>

        <div class="buttons">

            <button class="clear">C</button>
            <button>←</button>
            <button class="operator">%</button>
            <button class="operator">÷</button>

            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button class="operator">×</button>

            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button class="operator">−</button>

            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button class="operator">+</button>

            <button>0</button>
            <button>00</button>
            <button>.</button>
            <button class="equal">=</button>

        </div>

    </div>

</body>
</html>
