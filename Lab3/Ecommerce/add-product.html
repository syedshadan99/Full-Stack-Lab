<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shopora - Add Product</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-dark navbar-shop sticky-top">
    <div class="container">
      <a class="navbar-brand" href="index.html">Shopora</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="index.html#products">Products</a></li>
          <li class="nav-item"><a class="nav-link" href="index.html#reviews">Reviews</a></li>
          <li class="nav-item"><a class="nav-link" href="add-product.html">Add Product</a></li>
        </ul>
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" href="cart.html">Cart <span class="badge bg-warning text-dark">3</span></a></li>
          <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
          <li class="nav-item"><a class="nav-link" href="signup.html">Sign up</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- ADD PRODUCT FORM -->
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="card card-shop p-4">
          <h3 class="section-title">Add new product</h3>
          <p class="text-muted-shop mb-4">Fill in the details of the product.</p>
          <form>
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">Product name</label>
                <input type="text" class="form-control" placeholder="e.g. Smart Watch">
              </div>
              <div class="col-md-6">
                <label class="form-label">Price (Rs.)</label>
                <input type="number" class="form-control" placeholder="e.g. 4500">
              </div>
              <div class="col-md-6">
                <label class="form-label">Category</label>
                <select class="form-select">
                  <option>Electronics</option>
                  <option>Fashion</option>
                  <option>Bags</option>
                  <option>Accessories</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label">Stock</label>
                <input type="number" class="form-control" placeholder="e.g. 20">
              </div>
              <div class="col-12">
                <label class="form-label">Product image</label>
                <input type="file" class="form-control">
              </div>
              <div class="col-12">
                <label class="form-label">Description</label>
                <textarea class="form-control" rows="4" placeholder="Write about the product"></textarea>
              </div>
              <div class="col-12">
                <button type="submit" class="btn btn-shop">Add product</button>
                <a href="index.html" class="btn btn-outline-secondary">Cancel</a>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="footer text-center">
    <div class="container">&copy; 2026 Shopora. University project.</div>
  </footer>

  <!-- Bootstrap JS: only needed for the mobile menu button -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
